<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap</title>
        <!-- linking bootstrap -->
        <link href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <h2>Checks</h2>
        <div class="form-check ms-3">
            <input type="checkbox" class="form-check-input" id="chec">
            <label for="chec" class="form-check-label">option1</label>
        </div>
        <div class="from-check ms-3">
            <input type="checkbox" class="form-check-input" id="check2">
            <label for="check2" class="form-check-label">option2</label>
        </div>
        
        <br>

        <h2>Radio</h2>
        <div class="form-check ms-3">
            <input type="radio" id="rad" class="form-check-input" name="radiobs">
            <label for="rad" class="form-check-label">option1</label>
        </div>
        <div class="form-check ms-3">
            <input type="radio" class="form-check-input" id="rad2" name="radiobs">
            <label for="rad2" class="form-check-label">option2</label>
        </div>

        <br>

        <h2>Switch</h2>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
            <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
