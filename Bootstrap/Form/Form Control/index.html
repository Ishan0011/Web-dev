<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap</title>
        <!-- linking bootstrap -->
        <link href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <h1>Form</h1>
        <div class="mb-3 mt-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter Your Name"> <!-- normal form-control -->
            <label for="email" class="form-label">Email</label>
            <input type="email"  class="form-control-lg" name="email" id="email" placeholder="enter email"> <!--  form-control-lg for larger input box -->
            <label for="pass" class="form-label" >Password</label>
            <input type="password"  class="form-control-sm" name="pa" id="pass" placeholder="Password"> <!--  form-control-sm for smaller input box -->
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
